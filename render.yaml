services:
  # 1. Backend API Service
  - type: web
    name: lets-prep-backend
    runtime: docker
    region: oregon
    plan: free
    branch: main
    context: ./Backend
    dockerfilePath: ./Backend/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DOCKER_ENABLED
        value: false
      - key: REDIS_HOST
        value: lets-prep-redis
      - key: REDIS_PORT
        value: 6379
      # User must input these manually in dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generate: true
      - key: REDIS_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # 2. Redis Cache Service
  - type: redis
    name: lets-prep-redis
    region: oregon
    plan: free
    ipAllowList: []
