name: Lets Prep Bot

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------
  # 🛡️ SECURITY AUDIT JOB
  # ----------------------------------------------------
  security-audit:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for secret scanning

      # 1. Secret Scanning (TruffleHog)
      - name: 🔑 Secret Scanning
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      # 2. Docker Security (Hadolint)
      - name: 🐳 Dockerfile Linting
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Backend/Dockerfile
          failure-threshold: error

      # 3. Custom Grep Checks for Unsafe Flags
      - name: 🚫 Check for Forbidden Flags
        run: |
          echo "Scanning for unsafe Docker flags..."
          
          # Check for --privileged
          if grep -r --include="*.ts" --include="*.js" --include="*.sh" --include="*.yml" "\--privileged" .; then
            echo "❌ ERROR: Found usage of '--privileged'. This is strictly forbidden."
            exit 1
          fi
          
          # Check for --network=host
          if grep -r --include="*.ts" --include="*.js" --include="*.sh" --include="*.yml" "\--network=host" .; then
            echo "❌ ERROR: Found usage of '--network=host'. Network isolation is required."
            exit 1
          fi
          
          # Check for hardcoded secrets patterns (simple check)
          if grep -rE "AWS_ACCESS_KEY|AWS_SECRET_KEY|AKIA[0-9A-Z]{16}" .; then
             echo "❌ ERROR: Potential AWS keys found in code."
             # Note: TruffleHog does this better, but this is a fail-safe
             exit 1
          fi

          echo "✅ No unsafe flags or obvious secrets found."

  # ----------------------------------------------------
  # 🔍 CODE QUALITY JOB
  # ----------------------------------------------------
  quality-check:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [Backend, Frontend]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install Dependencies
        run: |
          cd ${{ matrix.service }}
          npm ci

      - name: 🧹 Linting
        run: |
          cd ${{ matrix.service }}
          npm run lint --if-present

      - name: 🏗️ Build Verification
        run: |
          cd ${{ matrix.service }}
          npm run build --if-present

  # ----------------------------------------------------
  # 🧪 TEST EXECUTION JOB
  # ----------------------------------------------------
  test-execution:
    name: 🧪 Test Execution
    runs-on: ubuntu-latest
    needs: [quality-check] # Only run tests if quality passes
    strategy:
      matrix:
        service: [Backend, Frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install Dependencies
        run: |
          cd ${{ matrix.service }}
          npm ci

      - name: 🧪 Run Unit Tests
        run: |
          cd ${{ matrix.service }}
          npm test --if-present
